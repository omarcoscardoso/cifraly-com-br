steps:
  # 1. Build da imagem Docker da aplicação Laravel
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push da imagem Docker para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}'

  # 3. Execução de Migrações do Banco de Dados via Cloud Run Job
  # (Executa isoladamente com acesso ao socket do Cloud SQL antes de atualizar o tráfego HTTP)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-migrations'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Configurando e executando Job de migração no Cloud Run..."
        gcloud run jobs deploy ${_SERVICE_NAME}-migrate \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$BUILD_ID \
          --region=${_REGION} \
          --service-account=${_SERVICE_ACCOUNT} \
          --command=php \
          --args=artisan,migrate,--force \
          --set-cloudsql-instances=${_CLOUD_SQL_INSTANCE} \
          --set-env-vars=DB_CONNECTION=mysql,APP_ENV=production,LOG_CHANNEL=stderr \
          --set-secrets=APP_KEY=${_APP_KEY_SECRET}:latest,DB_SOCKET=${_CLOUD_SQL_INSTANCE},DB_DATABASE=${_DB_DATABASE_SECRET}:latest,DB_USERNAME=${_DB_USERNAME_SECRET}:latest,DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest \
          || true
        
        gcloud run jobs execute ${_SERVICE_NAME}-migrate \
          --region=${_REGION} \
          --wait || echo "Aviso: Falha ao rodar migrations automaticamente via Job. Verifique permissões."

  # 4. Deploy no Google Cloud Run Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-service'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=APP_ENV=production,APP_DEBUG=false,LOG_CHANNEL=stderr,DB_CONNECTION=mysql,APP_URL=https://cifraly.com.br'
      - '--set-secrets=APP_KEY=${_APP_KEY_SECRET}:latest,DB_SOCKET=${_CLOUD_SQL_INSTANCE},DB_DATABASE=${_DB_DATABASE_SECRET}:latest,DB_USERNAME=${_DB_USERNAME_SECRET}:latest,DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID_SECRET}:latest,GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET_SECRET}:latest,GOOGLE_REDIRECT_URI=${_GOOGLE_REDIRECT_URI_SECRET}:latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY_NAME}/${_SERVICE_NAME}:latest'

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY_NAME: 'cifraly-com-br'
  _SERVICE_NAME: 'cifraly-com-br'
  _CLOUD_SQL_INSTANCE: 'cifraly-cloud-sql-instance'
  _APP_KEY_SECRET: 'cifraly-app-key'
  _DB_DATABASE_SECRET: 'cifraly-db-name'
  _DB_USERNAME_SECRET: 'cifraly-db-user'
  _DB_PASSWORD_SECRET: 'cifraly-db-password'
  _GOOGLE_CLIENT_ID_SECRET: 'cifraly-google-client-id'
  _GOOGLE_CLIENT_SECRET_SECRET: 'cifraly-google-client-secret'
  _GOOGLE_REDIRECT_URI_SECRET: 'cifraly-google-redirect-uri'
  _SERVICE_ACCOUNT: 'cifraly-service-account'

options:
  logging: CLOUD_LOGGING_ONLY
