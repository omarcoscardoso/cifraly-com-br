<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Gradiente do Ícone: Âmbar Elétrico -> Índigo Profundo -->
    <linearGradient id="cifralyIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="48%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gradiente de Contorno do Arco -->
    <linearGradient id="cifralyArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Gradiente de Destaque para o sufixo "ly" -->
    <linearGradient id="cifralyTextLyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <style>
      .cifraly-brand-root { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .cifraly-text-main { font-weight: 800; font-size: 52px; fill: currentColor; letter-spacing: -0.04em; }
      .cifraly-text-suffix { font-weight: 700; font-size: 52px; fill: #F59E0B; fill: url(#cifralyTextLyGrad); letter-spacing: -0.04em; }
      .cifraly-tagline { font-weight: 500; font-size: 11px; fill: currentColor; opacity: 0.6; letter-spacing: 0.22em; text-transform: uppercase; }
    </style>
  </defs>

  <g class="cifraly-brand-root">
    <!-- SÍMBOLO / ÍCONE -->
    <g transform="translate(8, 6) scale(0.17)">
      <!-- Fundo do Ícone (Rounded Square Escuro) -->
      <rect width="512" height="512" rx="120" fill="#0F172A" />

      <!-- Letra C estilizada / Arco -->
      <path d="M 330 138 A 148 148 0 1 0 330 374 L 302 334 A 104 104 0 1 1 302 178 Z" fill="url(#cifralyArcGrad)" />

      <!-- Corda / Linha 1 (Superior) -->
      <path d="M 204 196 L 356 196" stroke="url(#cifralyIconGrad)" stroke-width="22" stroke-linecap="round" />
      <circle cx="356" cy="196" r="14" fill="#F59E0B" />
      <circle cx="204" cy="196" r="8" fill="#FDE68A" />

      <!-- Corda / Linha 2 (Centro) -->
      <path d="M 184 256 L 396 256" stroke="url(#cifralyIconGrad)" stroke-width="24" stroke-linecap="round" />
      <circle cx="396" cy="256" r="16" fill="#F59E0B" />
      <circle cx="184" cy="256" r="9" fill="#FDE68A" />

      <!-- Corda / Linha 3 (Inferior) -->
      <path d="M 204 316 L 336 316" stroke="url(#cifralyIconGrad)" stroke-width="22" stroke-linecap="round" />
      <circle cx="336" cy="316" r="14" fill="#6366F1" />
      <circle cx="204" cy="316" r="8" fill="#A5B4FC" />
    </g>

    <!-- TIPOGRAFIA E SLOGAN -->
    <g transform="translate(118, 59)">
      <text class="cifraly-text-main" x="0" y="0">Cifra<tspan class="cifraly-text-suffix" fill="url(#cifralyTextLyGrad)">ly</tspan></text>
      <!-- Ponto de afinação musical sobre a letra 'i' -->
      <circle cx="42" cy="-36" r="5" fill="#F59E0B" />
      <!-- Tagline / Slogan -->
      <text class="cifraly-tagline" x="2" y="22">Cifras &amp; Escalas</text>
    </g>
  </g>
</svg>
